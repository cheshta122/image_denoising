[project]
name = "adaptive-ct-denoising"
version = "0.1.0"
description = "Research-oriented CT image denoising with adaptive transform-domain thresholding."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "PyWavelets>=1.5",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tqdm>=4.66",
    "Pillow>=10.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
cnn = ["torch>=2.0"]
shearlet = ["pyshearlab"]
dev = ["ruff>=0.4", "black>=24.0"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
